services:
  - type: web
    name: birman-banking-api
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: birman-banking
    env: static
    autoDeploy: true
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: birman-banking-api
          envVarKey: RENDER_EXTERNAL_URL